[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnwise"
version = "0.1.0"
description = "Reverse N-Wise Output-Oriented Testing for AI/ML and Quantum Computing Systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Lamine RIHANI", email = "lamine.rihani@sap.com" },
]
keywords = [
    "combinatorial-testing",
    "output-oriented-testing",
    "ai-testing",
    "ml-testing",
    "quantum-testing",
    "covering-array",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "python-sat>=1.8",
    "ortools>=9.8",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
]
bayesopt = [
    "scikit-optimize>=0.9",
]
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
rnwise = "rnwise.cli:main"

[tool.setuptools.packages.find]
include = ["rnwise*", "baselines*", "benchmarks*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: integration tests that train models / run full experiments",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
